<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="title desc">
<title id="title">Katge Infrastructure product flow</title>
<desc id="desc">A supported public media source and a chosen time range enter Katge. Inspect, select and retrieve through browser extensions, REST API or MCP. Search is a development preview. This is a product view without internal components.</desc>
